task: regression
stop_on_error: false
random_seed: 42
test_size: 0.2
output_file: results_regression_main.csv
append_to_file: true
kfold_n_splits: 5

datasets:
  - name: BikeSharing
    module: calm.datasets.bike_sharing
  - name: CaliforniaHousing
    module: calm.datasets.california_housing
  - name: ParkinsonsMotor
    module: calm.datasets.parkinsons
  - name: ParkinsonsTotal
    module: calm.datasets.parkinsons
  - name: SeoulBike
    module: calm.datasets.seoul_bike
  - name: Wine
    module: calm.datasets.wine
  - name: Energy
    module: calm.datasets.energy
  - name: CCPP
    module: calm.datasets.ccpp
  - name: Electrical
    module: calm.datasets.electrical
  - name: Elevators
    module: calm.datasets.elevators
  - name: No2
    module: calm.datasets.no2
  - name:  Sensory
    module: calm.datasets.sensory
  - name: Airfoil
    module: calm.datasets.airfoil
  - name: SkillCraft
    module: calm.datasets.skill_craft
  - name: Ailerons
    module: calm.datasets.ailerons


methods:
  - name: XGBRegressor
    type: blackbox
  - name: MaskedNAMRegressor
    type: maskedgam
    parameters: {}
  - name: NoInteractionsEBMRegressor
    type: maskedgam
    parameters: {}
  - name: CALMRegressor
    type: calm
  - name: EBM2Regressor
    type: competitor
  - name: GAMINetRegressor
    type: competitor
  - name: NodeGAM2Regressor
    type: competitor
    parameters:
      max_time: [300]

metrics: [r2, mae, rmse]

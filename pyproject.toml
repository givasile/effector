[build-system]
#requires = ["setuptools", "setuptools-scm"]
#build-backend = "setuptools.build_meta"
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.setuptools]
packages = ['effector']
package-dir = {'effector'='effector'}

[project]
name = "effector"
description = "An eXplainable AI package for tabular data."
authors = [{name = "Vasilis Gkolemis", email = "ntipakos@gmail.com"}]
maintainers = [
    {name = "Christos Diou", email = "cdiou@hua.gr"},
    {name = "Julia Herbinger", email = "julia.herbinger@gmail.com"},
    {name = "Giuseppe Casalicchio", email = "giuseppe.casalicchio@gmail.com"},
    {name = "Hubert Baniecki", email = "h.baniecki@uw.edu.pl"},
    {name = "Dimitris Kyriakopoulos", email = "dimitrisskyriakopoulos@gmail.com"},
    {name = "Dimitrios Rontogiannis", email = "dimronto@gmail.com"}
]
license = {text = "MIT License"}
requires-python = ">=3.10"
keywords = ["explainability", "interpretability", "machine learning", "deep learning", "regional XAI", "feature effect"]
version = "0.5.0"
readme = "README.md"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "tqdm",
]

[project.urls]
documentation = "https://xai-effector.github.io"
source = "https://github.com/givasile/effector"
tracker = "https://github.com/givasile/effector/issues"

[project.optional-dependencies]
shap = ["shap", "shapiq"]
tutorials = ["ipython", "pandas", "tensorflow-cpu", "keras", "ucimlrepo", "jupyter", "openml", "tabpfn"]
all = ["effector[shap,tutorials]"]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "coverage",
    "shap",
    "shapiq",
    "numba>=0.60; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "ucimlrepo",
    "pandas",  # DataFrame-ingestion tests only; never a runtime dependency (R10)
    "scikit-learn",  # adapter tests only; never a runtime dependency
]
docs = [
    "mkdocs",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-material",
    "mkdocs-glightbox",
    "nbconvert",  # docs-pages/docs-images: convert saved notebook outputs, no execution
    "jupyter-core",
    "ipykernel",  # local notebook re-execution (jupyter nbconvert --execute)
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff",
    "pyqt5",  # GUI backend for matplotlib, so scripts/api_playground.py pops up windows
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselected on the merge gate with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"effector/__init__.py" = ["F401"]
"tests/*" = ["E731", "F403", "F405"]
[build-system]
#requires = ["setuptools", "setuptools-scm"]
#build-backend = "setuptools.build_meta"
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "effector"
description = "An eXplainable AI package for tabular data."
authors = []
maintainers = []
license = {text = "MIT License"}
requires-python = ">=3.10"
keywords = ["explainability", "interpretability", "machine learning", "deep learning", "regional XAI", "feature effect"]
version = "0.2.0"
readme = "README.md"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "tqdm",
    "shap",
    "shapiq>=1.2.1",
    "ucimlrepo",
    "overrides",
    "scikit-learn>=1.3"
]

[project.optional-dependencies]
tutorials = [
    "ipython", 
    "pandas", 
    "tensorflow-cpu", 
    "keras", 
    "jupyter", 
    "openml", 
    "tabpfn"
]

calm = [
    "ipython",
    "pandas",
    "keras",
    "jupyter",
    "openml",
    # CALM-specific 
    "torch",          
    "pygam>=0.9.1",
    "interpret>=0.6.0",
    "seaborn>=0.13",
    "aif360>=0.6.0",
    "nodegam",
    "pmlb>=1.0.1",
    "mlflow>=2.0.0",
    "gaminet>=0.6.1",
]

windows = [
    "tensorflow==2.18.0"
]

linux-mac = [
    "tensorflow==2.19.0"
]
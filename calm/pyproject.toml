[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "calm"
version = "0.1.0"
description = "Implementation of CALM (Conditionally Additive Local Models) for interpretable and accurate local additive modeling."
authors = [{name = "Vasilis Gkolemis", email = "ntipakos@gmail.com"}]
maintainers = [
    {name = "Christos Diou", email = "cdiou@hua.gr"},
    {name = "Julia Herbinger", email = "julia.herbinger@gmail.com"},
    {name = "Giuseppe Casalicchio", email = "giuseppe.casalicchio@gmail.com"},
    {name = "Hubert Baniecki", email = "h.baniecki@uw.edu.pl"},
    {name = "Dimitris Kyriakopoulos", email = "dimitrisskyriakopoulos@gmail.com"},
    {name = "Dimitrios Rontogiannis", email = "dimronto@gmail.com"}
]
license = {text = "MIT License"}
requires-python = ">=3.10"
keywords = ["explainability", "interpretability", "machine learning", "deep learning", "regional XAI", "feature effect"]
readme = "README.md"

dependencies = [
    "effector>=0.2.0",
    "numpy",
    "scikit-learn>=1.3",

    # maskedGAM / competitors / blackbox dependencies
    "interpret>=0.6.0", # maskedGAM-competitor
    "pygam>=0.9.1", # spline maskedGAM-competitor
    "keras", # for NAM maskedGAM
    "tensorflow==2.18.0; sys_platform == 'win32'", # for NAM, DNN (Windows)
    "tensorflow==2.19.0; sys_platform != 'win32'", # for NAM, DNN (Linux/Mac)
    "xgboost",
]

[project.optional-dependencies]
experiments = [
    "pandas", # for datasets, GAMINet, NodeGAM 
    "matplotlib",

    "ipython", # for running the notebooks in the experiments
    "jupyter", # for running the notebooks in the experiments
    
    # Datasets dependencies
    "openml", # for loading datasets in the experiments
    "pmlb>=1.0.1", # for loading datasets in the experiments
    "aif360>=0.6.0", # for loading compas in the experiments
    "scipy", # for sigmoid function in the experiments

    # competitors dependencies
    "nodegam", # NodeGAM competitor
    "torch", # NodeGAM competitor 
    "gaminet>=0.6.1", # GAMINet ga2m competitor
]

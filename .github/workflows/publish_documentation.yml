name: Publish documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-documentation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Build docs
      run: |
        cp CHANGELOG.md docs/docs/changelog.md
        cp CONTRIBUTING.md docs/docs/contributing.md
        uv run --python 3.10 --no-default-groups --group docs mkdocs build -f docs/mkdocs.yml

    - name: Save site site as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: docs/site

  push-site:
    name: Copy site to effector.github.io
    if: github.event_name != 'pull_request'
    needs:
    - build-documentation

    runs-on: ubuntu-latest

    steps:
    - name: Download the site as artifact
      uses: actions/download-artifact@v8
      with:
        name: docs-site
        path: site

    - name: Clone xai-effector.github.io and checkout gh-pages branch
      uses: actions/checkout@v4
      with:
          repository: xai-effector/xai-effector.github.io
          ref: gh-pages
          ssh-key: ${{ secrets.EFFECTOR_DOCS_DEPLOY_KEY }}
          path: xai-effector.github.io

    - name: rm old site and copy new site
      run: |
          rm -rf xai-effector.github.io/*
          cp -r site/* xai-effector.github.io

    - name: commit and push
      run: |
          cd xai-effector.github.io
          git config --global user.email "ntipakos@gmail.com"
          git config --global user.name "ntipakos"
          git add .
          if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
          fi
          git commit -m "Update site from givasile/effector"
          git push --force origin gh-pages
